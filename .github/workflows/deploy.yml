name: MyLawyer CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # 1. Quality Assurance & Production Build Job
  # -----------------------------------------------------------
  quality_and_build:
    name: Code Quality, Automated Tests & Build
    runs-on: [self-hosted, Linux, vps]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        run: |
          node -v
          npm -v

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Static Analysis (Oxlint - 104 rules)
        run: npm run lint

      - name: Run Unit & Integration Test Suite (34 automated tests)
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Package Release Tarball
        run: |
          tar -czf /tmp/mylawyer-build.tar.gz -C dist .
          ls -lh /tmp/mylawyer-build.tar.gz

  # -----------------------------------------------------------
  # 2. Zero-Downtime Deployment to VPS Job
  # -----------------------------------------------------------
  deploy_to_vps:
    name: Zero-Downtime Atomic Deployment (Contabo VPS)
    needs: quality_and_build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: [self-hosted, Linux, vps]
    steps:
      - name: Execute Atomic Zero-Downtime Deploy on VPS
        run: |
          sudo /var/www/mylawyer/deploy.sh

      - name: Post-Deployment Live Health Check
        run: |
          echo "Verifying local and public HTTP endpoints..."
          LOCAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1/)
          echo "Local HTTP status: $LOCAL_STATUS"
          if [ "$LOCAL_STATUS" != "200" ]; then
            echo "Local Health check failed! Status: $LOCAL_STATUS"
            exit 1
          fi
          
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://13.140.141.32/)
          echo "Public HTTP status: $PUBLIC_STATUS"
          if [ "$PUBLIC_STATUS" != "200" ]; then
            echo "Public Health check failed! Status: $PUBLIC_STATUS"
            exit 1
          fi
          echo "Zero-Downtime Production Deployment is 100% verified and operational."

  # -----------------------------------------------------------
  # 3. Manual Rollback Job (Triggered via Workflow Dispatch)
  # -----------------------------------------------------------
  rollback_vps:
    name: Emergency Rollback to Previous Stable Release
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: [self-hosted, Linux, vps]
    steps:
      - name: Execute Atomic Rollback Script on VPS
        run: |
          sudo /var/www/mylawyer/rollback.sh

      - name: Verify Live Service After Rollback
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1/)
          echo "HTTP status after rollback: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Service unhealthy after rollback! Status: $HTTP_STATUS"
            exit 1
          fi
          echo "Rollback verified successfully."
